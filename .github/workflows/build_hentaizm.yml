name: Build HentaiZM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: chmod +x ./gradlew && ./gradlew :src:tr:hentaizm:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hentaizm-apk
          path: src/tr/hentaizm/build/outputs/apk/debug/*.apk
